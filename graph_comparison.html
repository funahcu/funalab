<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAグラフ vs Powerlaw Clusterグラフ 比較</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4ef; color: #1a1a18; padding: 24px 16px; min-height: 100vh; }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 20px; color: #1a1a18; }
  .panel { background: #fff; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .panel-title { font-size: 13px; font-weight: 500; margin-bottom: 10px; color: #5f5e5a; }
  .ctrl { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; color: #5f5e5a; }
  .ctrl label { min-width: 160px; }
  .ctrl input[type=range] { flex: 1; accent-color: #378ADD; }
  .ctrl span.val { min-width: 36px; text-align: right; font-size: 13px; font-weight: 500; color: #1a1a18; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; margin-left: 6px; background: #E1F5EE; color: #085041; }
  .regen-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  button { font-size: 12px; padding: 5px 14px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 8px; background: #fff; cursor: pointer; color: #1a1a18; }
  button:hover { background: #f0efea; }
  .hint { font-size: 12px; color: #888780; }
  .graphs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .graph-wrap { border-radius: 12px; overflow: hidden; border: 0.5px solid rgba(0,0,0,0.12); }
  .graph-label { font-size: 12px; font-weight: 500; padding: 6px 12px; }
  .graph-label-ba { background: #E6F1FB; color: #0C447C; }
  .graph-label-pl { background: #E1F5EE; color: #085041; }
  canvas.graph-canvas { display: block; background: #f8f8f6; width: 100%; }
  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; border-bottom: 0.5px solid rgba(0,0,0,0.08); color: #5f5e5a; }
  .stat-row:last-child { border-bottom: none; }
  .stat-val { font-weight: 500; color: #1a1a18; }
  .deg-wrap { position: relative; height: 180px; }
  @media (max-width: 520px) {
    .graphs-row, .stats-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<h1>Barabasi-Albert vs Powerlaw Cluster グラフ 比較</h1>

<div class="panel">
  <p class="panel-title">パラメータ設定</p>
  <div class="ctrl"><label>ノード数 (n)</label><input type="range" id="n" min="20" max="100" value="50" step="5"><span class="val" id="nv">50</span></div>
  <div class="ctrl"><label>接続数 (m)</label><input type="range" id="m" min="1" max="6" value="2" step="1"><span class="val" id="mv">2</span></div>
  <div class="ctrl"><label>クラスタ確率 (p) <span class="badge">PL only</span></label><input type="range" id="p" min="0" max="1" value="0.5" step="0.05"><span class="val" id="pv">0.50</span></div>
  <div class="regen-row">
    <button onclick="generate()">↺ 再生成</button>
    <span class="hint">p = 0 のとき両グラフは統計的に近似します</span>
  </div>
</div>

<div class="graphs-row">
  <div class="graph-wrap">
    <div class="graph-label graph-label-ba">Barabasi-Albert (BA)</div>
    <canvas class="graph-canvas" id="cvBA" height="260"></canvas>
  </div>
  <div class="graph-wrap">
    <div class="graph-label graph-label-pl">Powerlaw Cluster (PL)</div>
    <canvas class="graph-canvas" id="cvPL" height="260"></canvas>
  </div>
</div>

<div class="stats-row">
  <div class="panel">
    <p class="panel-title">BA グラフ 統計</p>
    <div class="stat-row"><span>エッジ数</span><span class="stat-val" id="ba-edges">-</span></div>
    <div class="stat-row"><span>平均次数</span><span class="stat-val" id="ba-deg">-</span></div>
    <div class="stat-row"><span>クラスタ係数</span><span class="stat-val" id="ba-cc">-</span></div>
    <div class="stat-row"><span>最大次数</span><span class="stat-val" id="ba-maxdeg">-</span></div>
  </div>
  <div class="panel">
    <p class="panel-title">PL グラフ 統計</p>
    <div class="stat-row"><span>エッジ数</span><span class="stat-val" id="pl-edges">-</span></div>
    <div class="stat-row"><span>平均次数</span><span class="stat-val" id="pl-deg">-</span></div>
    <div class="stat-row"><span>クラスタ係数</span><span class="stat-val" id="pl-cc">-</span></div>
    <div class="stat-row"><span>最大次数</span><span class="stat-val" id="pl-maxdeg">-</span></div>
  </div>
</div>

<div class="panel">
  <p class="panel-title">次数分布（両グラフ重ね合わせ）</p>
  <div class="deg-wrap">
    <canvas id="cvDeg" role="img" aria-label="次数分布の比較チャート"></canvas>
  </div>
</div>

<script>
let degChart = null;

function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

function barabasiAlbert(n, m) {
  const adj = Array.from({length: n}, () => new Set());
  for (let i = 0; i < m + 1; i++)
    for (let j = 0; j < m + 1; j++)
      if (i !== j) { adj[i].add(j); adj[j].add(i); }
  const deg = adj.map(s => s.size);
  for (let i = m + 1; i < n; i++) {
    const total = deg.reduce((a, b) => a + b, 0);
    const chosen = new Set();
    let safety = 0;
    while (chosen.size < Math.min(m, i) && safety++ < 1000) {
      let r = Math.random() * total, cum = 0;
      for (let j = 0; j < i; j++) {
        cum += deg[j];
        if (cum >= r) { chosen.add(j); break; }
      }
    }
    deg.push(0);
    for (const j of chosen) { adj[i].add(j); adj[j].add(i); deg[i]++; deg[j]++; }
  }
  return adj;
}

function powerlawCluster(n, m, p) {
  const adj = barabasiAlbert(n, m);
  for (let v = m + 1; v < n; v++) {
    const nbrs = [...adj[v]];
    for (const u of nbrs) {
      if (Math.random() < p) {
        const uNbrs = [...adj[u]].filter(w => w !== v && !adj[v].has(w));
        if (uNbrs.length > 0) {
          const w = uNbrs[rnd(0, uNbrs.length - 1)];
          adj[v].add(w); adj[w].add(v);
        }
      }
    }
  }
  return adj;
}

function forceLayout(n, adj, iters) {
  const pos = Array.from({length: n}, () => [Math.random(), Math.random()]);
  const k = Math.sqrt(1 / n);
  for (let iter = 0; iter < iters; iter++) {
    const disp = Array.from({length: n}, () => [0, 0]);
    for (let v = 0; v < n; v++)
      for (let u = v + 1; u < n; u++) {
        const dx = pos[v][0] - pos[u][0], dy = pos[v][1] - pos[u][1];
        const d = Math.max(Math.sqrt(dx * dx + dy * dy), 0.01);
        const f = k * k / d;
        disp[v][0] += dx / d * f; disp[v][1] += dy / d * f;
        disp[u][0] -= dx / d * f; disp[u][1] -= dy / d * f;
      }
    for (let v = 0; v < n; v++)
      for (const u of adj[v]) {
        const dx = pos[v][0] - pos[u][0], dy = pos[v][1] - pos[u][1];
        const d = Math.max(Math.sqrt(dx * dx + dy * dy), 0.01);
        const f = d / k;
        disp[v][0] -= dx / d * f; disp[v][1] -= dy / d * f;
      }
    const t = 0.1 * (1 - iter / iters);
    for (let v = 0; v < n; v++) {
      const dl = Math.sqrt(disp[v][0] ** 2 + disp[v][1] ** 2);
      if (dl > 0) {
        pos[v][0] = Math.max(0.02, Math.min(0.98, pos[v][0] + disp[v][0] / dl * Math.min(dl, t)));
        pos[v][1] = Math.max(0.02, Math.min(0.98, pos[v][1] + disp[v][1] / dl * Math.min(dl, t)));
      }
    }
  }
  return pos;
}

function drawGraph(canvasId, adj, nodeColor, edgeColor) {
  const cv = document.getElementById(canvasId);
  const n = adj.length;
  const W = cv.parentElement.clientWidth;
  const H = 260;
  cv.width = W * devicePixelRatio;
  cv.height = H * devicePixelRatio;
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.fillStyle = '#f8f8f6';
  ctx.fillRect(0, 0, W, H);
  const pos = forceLayout(n, adj, 60);
  const px = i => 20 + pos[i][0] * (W - 40);
  const py = i => 20 + pos[i][1] * (H - 40);
  const deg = adj.map(s => s.size);
  const maxDeg = Math.max(...deg);
  ctx.strokeStyle = edgeColor;
  ctx.lineWidth = 1;
  for (let v = 0; v < n; v++)
    for (const u of adj[v]) if (u > v) {
      ctx.beginPath(); ctx.moveTo(px(v), py(v)); ctx.lineTo(px(u), py(u)); ctx.stroke();
    }
  for (let v = 0; v < n; v++) {
    const r = 3 + (deg[v] / maxDeg) * 6;
    ctx.beginPath(); ctx.arc(px(v), py(v), r, 0, Math.PI * 2);
    ctx.fillStyle = nodeColor; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 0.5; ctx.stroke();
  }
}

function clusterCoeff(adj) {
  let total = 0, count = 0;
  for (let v = 0; v < adj.length; v++) {
    const nbrs = [...adj[v]];
    const k = nbrs.length;
    if (k < 2) continue;
    let tri = 0;
    for (let i = 0; i < k; i++)
      for (let j = i + 1; j < k; j++)
        if (adj[nbrs[i]].has(nbrs[j])) tri++;
    total += 2 * tri / (k * (k - 1));
    count++;
  }
  return count ? total / count : 0;
}

function degDist(adj) {
  const dist = {};
  for (const s of adj) { const d = s.size; dist[d] = (dist[d] || 0) + 1; }
  return dist;
}

function statsOf(adj, prefix) {
  const n = adj.length;
  const edges = adj.reduce((a, s) => a + s.size, 0) / 2;
  const deg = adj.map(s => s.size);
  document.getElementById(prefix + '-edges').textContent = edges;
  document.getElementById(prefix + '-deg').textContent = (deg.reduce((a, b) => a + b, 0) / n).toFixed(2);
  document.getElementById(prefix + '-cc').textContent = clusterCoeff(adj).toFixed(3);
  document.getElementById(prefix + '-maxdeg').textContent = Math.max(...deg);
}

function generate() {
  const n = +document.getElementById('n').value;
  const m = +document.getElementById('m').value;
  const p = +document.getElementById('p').value;
  const adjBA = barabasiAlbert(n, m);
  const adjPL = powerlawCluster(n, m, p);
  drawGraph('cvBA', adjBA, '#378ADD', 'rgba(55,138,221,0.2)');
  drawGraph('cvPL', adjPL, '#1D9E75', 'rgba(29,158,117,0.2)');
  statsOf(adjBA, 'ba');
  statsOf(adjPL, 'pl');
  const distBA = degDist(adjBA);
  const distPL = degDist(adjPL);
  const allDeg = [...new Set([...Object.keys(distBA), ...Object.keys(distPL)].map(Number))].sort((a, b) => a - b);
  const dataBA = allDeg.map(d => distBA[d] || 0);
  const dataPL = allDeg.map(d => distPL[d] || 0);
  if (degChart) degChart.destroy();
  degChart = new Chart(document.getElementById('cvDeg'), {
    type: 'bar',
    data: {
      labels: allDeg.map(String),
      datasets: [
        { label: 'BA', data: dataBA, backgroundColor: 'rgba(55,138,221,0.65)', borderColor: '#378ADD', borderWidth: 1 },
        { label: 'PL (p=' + p.toFixed(2) + ')', data: dataPL, backgroundColor: 'rgba(29,158,117,0.55)', borderColor: '#1D9E75', borderWidth: 1 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: true, labels: { font: { size: 11 }, boxWidth: 10, padding: 8 } } },
      scales: {
        x: { title: { display: true, text: '次数', font: { size: 11 } }, ticks: { font: { size: 10 } } },
        y: { title: { display: true, text: 'ノード数', font: { size: 11 } }, ticks: { font: { size: 10 }, stepSize: 1 } }
      }
    }
  });
}

['n', 'm', 'p'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    document.getElementById(id + 'v').textContent = id === 'p' ? (+el.value).toFixed(2) : el.value;
    generate();
  });
});

window.addEventListener('load', generate);
</script>
</body>
</html>
